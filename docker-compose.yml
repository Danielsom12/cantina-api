# Opcional: sobe um PostgreSQL local com o esquema provisorio (db/*.sql).
# Docker NAO e requisito da AVC; e so uma conveniencia para desenvolver sem instalar o Postgres.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cantina
      POSTGRES_USER: ${DB_USER:-cantina}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cantina}
    ports:
      - "5433:5432"
    volumes:
      - ./db:/docker-entrypoint-initdb.d:ro
